name: Backend Tests

on:
pull_request:
branches:
- main
- develop

push:
branches:
- main
- develop

permissions:
contents: read

jobs:
backend-tests:
name: FastAPI and PostgreSQL Tests
runs-on: ubuntu-latest

```
services:
  postgres:
    image: postgres:16

    env:
      POSTGRES_DB: support_ticket_test
      POSTGRES_USER: support_ticket_test_user
      POSTGRES_PASSWORD: support_ticket_test_password

    ports:
      - 5432:5432

    options: >-
      --health-cmd "pg_isready -U support_ticket_test_user -d support_ticket_test"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

defaults:
  run:
    working-directory: src/backend

env:
  APP_NAME: AI-Powered Support Ticket Assistant
  APP_ENV: test
  APP_VERSION: 0.1.0
  DEBUG: false
  LOG_LEVEL: INFO
  API_PREFIX: /api/v1

  TEST_DATABASE_URL: postgresql://support_ticket_test_user:support_ticket_test_password@localhost:5432/support_ticket_test
  DATABASE_URL: postgresql://support_ticket_test_user:support_ticket_test_password@localhost:5432/support_ticket_test

  AI_PROVIDER: mock
  AI_API_KEY: test-placeholder-key
  AI_MODEL: mock-model
  AI_TIMEOUT_SECONDS: 5
  AI_MAX_RETRIES: 0
  AI_PROMPT_VERSION: ticket-analysis-v1

  ALLOWED_ORIGINS: http://localhost:3000
  DEFAULT_PAGE_SIZE: 20
  MAX_PAGE_SIZE: 100

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: pip
      cache-dependency-path: |
        src/backend/requirements.txt
        src/backend/requirements-dev.txt

  - name: Upgrade pip
    run: python -m pip install --upgrade pip

  - name: Install backend dependencies
    run: |
      pip install -r requirements.txt
      if [ -f requirements-dev.txt ]; then
        pip install -r requirements-dev.txt
      fi

  - name: Wait for PostgreSQL
    run: |
      python - <<'PY'
      import socket
      import time

      host = "localhost"
      port = 5432

      for attempt in range(30):
          try:
              with socket.create_connection((host, port), timeout=2):
                  print("PostgreSQL is ready.")
                  break
          except OSError:
              print(f"Waiting for PostgreSQL... attempt {attempt + 1}/30")
              time.sleep(2)
      else:
          raise SystemExit("PostgreSQL did not become ready.")
      PY

  - name: Run database migrations
    run: alembic upgrade head

  - name: Run backend tests
    run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  - name: Upload coverage report
    uses: actions/upload-artifact@v4
    with:
      name: backend-coverage-report
      path: src/backend/coverage.xml
      if-no-files-found: error
```
